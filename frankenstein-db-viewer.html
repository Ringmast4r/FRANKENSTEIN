<!DOCTYPE html>
<html>
<head>
  <title>Frankenstein DB Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Consolas', 'Monaco', monospace;
      padding: 20px;
      background: #0a0a0a;
      color: #e0e0e0;
      margin: 0;
    }
    h1 { color: #00dc50; margin: 0 0 5px 0; }
    h1 span { color: #c8ff00; }
    .subtitle { color: #3c8c50; margin: 0 0 20px 0; font-size: 0.85em; }
    h3 { color: #00dc50; margin: 20px 0 10px 0; }

    #drop {
      border: 2px dashed #00dc50;
      padding: 40px;
      text-align: center;
      margin-bottom: 20px;
      background: #111;
      border-radius: 8px;
      transition: background 0.2s;
    }
    #drop:hover, #drop.dragover { background: #1a2a1a; }
    input[type="file"] { color: #ccc; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-box {
      background: #111;
      border: 1px solid #00dc50;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }
    .stat-box.alive { border-color: #00dc50; }
    .stat-box.dns { border-color: #ffdc00; }
    .stat-box.dead { border-color: #ff3c3c; }
    .stat-box.https { border-color: #50c8ff; }
    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
    }
    .stat-box.alive .stat-value { color: #00dc50; }
    .stat-box.dns .stat-value { color: #ffdc00; }
    .stat-box.dead .stat-value { color: #ff3c3c; }
    .stat-box.https .stat-value { color: #50c8ff; }
    .stat-box .stat-value { color: #00dc50; }
    .stat-label { color: #888; margin-top: 5px; font-size: 0.9em; }

    .section {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .tab {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      padding: 8px 18px;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      transition: all 0.15s;
    }
    .tab:hover { background: #2a2a2a; color: #fff; }
    .tab.active { background: #00dc50; color: #000; border-color: #00dc50; font-weight: bold; }
    .tab .count { margin-left: 5px; opacity: 0.7; }

    .controls {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls input[type="text"] {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-family: inherit;
      width: 350px;
    }
    .controls input[type="text"]:focus { border-color: #00dc50; outline: none; }
    .controls button, .export-btn {
      background: #00dc50;
      border: none;
      color: #000;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: background 0.15s;
    }
    .controls button:hover, .export-btn:hover { background: #00ff64; }
    .export-btn { margin-left: auto; }

    .table-container {
      max-height: 600px;
      overflow: auto;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85em;
    }
    th, td {
      border: 1px solid #333;
      padding: 7px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #00a040;
      color: #000;
      position: sticky;
      top: 0;
      z-index: 1;
      cursor: pointer;
      user-select: none;
    }
    th:hover { background: #00dc50; }
    th .sort-arrow { margin-left: 4px; font-size: 0.8em; }
    tr:nth-child(even) { background: #1a1a1a; }
    tr:hover { background: #1a2a1a; }

    .status-alive { color: #00dc50; font-weight: bold; }
    .status-dns { color: #ffdc00; font-weight: bold; }
    .status-dead { color: #ff3c3c; font-weight: bold; }
    .status-error { color: #ff8000; font-weight: bold; }
    .status-unknown { color: #666; }

    .ip { color: #50c8ff; font-size: 0.85em; }
    .title-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
    .server-cell { color: #a0a0a0; font-size: 0.85em; }
    .ms { color: #888; }
    .tls-yes { color: #00dc50; }
    .tls-no { color: #555; }
    .redirect { color: #c8a0ff; font-size: 0.8em; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }

    .bar-chart {
      display: flex;
      height: 30px;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }
    .bar-segment {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      font-weight: bold;
      color: #000;
      transition: width 0.3s;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin: 8px 0 15px 0;
      font-size: 0.85em;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    #result-info { color: #666; margin-left: 10px; font-size: 0.9em; }

    .detail-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 4px 12px;
      font-size: 0.9em;
    }
    .detail-label { color: #3c8c50; font-weight: bold; }
    .detail-value { color: #e0e0e0; word-break: break-all; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #111;
      border: 2px solid #00dc50;
      border-radius: 12px;
      padding: 25px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { margin-top: 0; }
    .modal-close {
      float: right;
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-close:hover { background: #333; color: #fff; }

    /* Light mode */
    body.light { background: #f5f5f5; color: #222; }
    body.light h1 { color: #007a30; }
    body.light h3 { color: #007a30; }
    body.light .subtitle { color: #5a8a5a; }
    body.light #drop { background: #e8e8e8; border-color: #007a30; }
    body.light input[type="file"] { color: #333; }
    body.light .stat-box { background: #fff; }
    body.light .section { background: #fff; border-color: #ccc; }
    body.light .tab { background: #e0e0e0; border-color: #bbb; color: #444; }
    body.light .tab:hover { background: #d0d0d0; color: #000; }
    body.light .tab.active { background: #007a30; color: #fff; border-color: #007a30; }
    body.light .controls input[type="text"] { background: #fff; border-color: #bbb; color: #222; }
    body.light .controls input[type="text"]:focus { border-color: #007a30; }
    body.light th { background: #007a30; color: #fff; }
    body.light th:hover { background: #009a40; }
    body.light tr:nth-child(even) { background: #f0f0f0; }
    body.light tr:hover { background: #e0f0e0; }
    body.light td { border-color: #ddd; }
    body.light .modal { background: #fff; border-color: #007a30; }
    body.light .modal-close { border-color: #bbb; color: #666; }
    body.light .modal-close:hover { background: #eee; color: #000; }
    body.light .detail-label { color: #007a30; }
    body.light .detail-value { color: #222; }
    body.light .ms { color: #666; }
    body.light .server-cell { color: #555; }
    body.light .title-cell { color: #333; }
    body.light #result-info { color: #888; }

    h1 { cursor: pointer; user-select: none; }
    h1 span { cursor: pointer; }

    /* Easter egg overlay */
    #easter-egg {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
    }
    #easter-egg.show { display: flex; }
    #easter-egg .ee-line1 { color: #3c8c50; font-size: 1.2em; margin-bottom: 15px; opacity: 0; animation: fadeIn 0.5s 0.3s forwards; }
    #easter-egg .ee-names { color: #c8ff00; font-size: 2.2em; font-weight: bold; opacity: 0; animation: fadeIn 0.5s 0.8s forwards; }
    #easter-egg .ee-heart { color: #ff3c3c; font-size: 2em; margin-top: 20px; opacity: 0; animation: fadeIn 0.5s 1.5s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <h1><span id="bolt" onclick="showEasterEgg()">&#9889;</span> <span onclick="toggleTheme()">Frankenstein DB Viewer</span></h1>
  <p class="subtitle">Dual Phenomenology Site Checker &mdash; Database Explorer</p>

  <div id="easter-egg" onclick="hideEasterEgg()">
    <div class="ee-line1">this is for</div>
    <div class="ee-names">_m0usem0use_ &amp; ziggy</div>
    <div class="ee-heart">&lt;3</div>
  </div>

  <div id="drop">
    Drop your <strong>frankenstein.db</strong> file here or
    <input type="file" id="file" accept=".db,.sqlite,.sqlite3">
  </div>

  <div id="output"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times; Close</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    let db = null;
    let allSites = [];
    let currentSort = { col: null, asc: true };
    let currentFilter = 'all';

    // ── DB Loading ──────────────────────────────────────────
    async function loadDB(file) {
      output.innerHTML = '<p style="color:#00dc50">Loading database...</p>';
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const buf = await file.arrayBuffer();
      db = new SQL.Database(new Uint8Array(buf));
      loadAllSites();
      renderDashboard();
    }

    function query(sql) {
      try {
        const r = db.exec(sql);
        return r.length ? r[0] : { columns: [], values: [] };
      } catch (e) { console.error(sql, e); return { columns: [], values: [] }; }
    }
    function scalar(sql) {
      const r = query(sql);
      return r.values.length ? r.values[0][0] : 0;
    }

    function loadAllSites() {
      const r = query(`SELECT domain, dns_alive, dns_ips, dns_cnames, dns_mx, dns_ns, dns_error,
        http_alive, http_status, http_title, http_server, http_redirect,
        http_tls, http_tls_issuer, http_error, http_response_ms, status,
        first_checked, last_checked, times_checked FROM sites ORDER BY domain`);
      allSites = r.values.map(row => ({
        domain: row[0],
        dnsAlive: row[1], dnsIPs: row[2], dnsCnames: row[3], dnsMX: row[4], dnsNS: row[5], dnsError: row[6],
        httpAlive: row[7], httpStatus: row[8], httpTitle: row[9], httpServer: row[10], httpRedirect: row[11],
        httpTLS: row[12], httpTLSIssuer: row[13], httpError: row[14], httpRespMs: row[15], status: row[16],
        firstChecked: row[17], lastChecked: row[18], timesChecked: row[19]
      }));
    }

    // ── Dashboard ───────────────────────────────────────────
    function renderDashboard() {
      const total = allSites.length;
      const alive = allSites.filter(s => s.status === 'alive').length;
      const dnsOnly = allSites.filter(s => s.status === 'dns_only').length;
      const dead = allSites.filter(s => s.status === 'dead').length;
      const errors = allSites.filter(s => s.status === 'error' || s.status === 'unknown').length;
      const https = allSites.filter(s => s.httpTLS === 1).length;
      const alivePct = total ? ((alive / total) * 100).toFixed(1) : '0.0';

      const aliveW = total ? (alive / total * 100) : 0;
      const dnsW = total ? (dnsOnly / total * 100) : 0;
      const deadW = total ? (dead / total * 100) : 0;
      const errW = total ? (errors / total * 100) : 0;

      output.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" style="color:#00dc50">${total}</div>
            <div class="stat-label">Total Sites</div>
          </div>
          <div class="stat-box alive">
            <div class="stat-value">${alive}</div>
            <div class="stat-label">Alive (${alivePct}%)</div>
          </div>
          <div class="stat-box dns">
            <div class="stat-value">${dnsOnly}</div>
            <div class="stat-label">DNS Only</div>
          </div>
          <div class="stat-box dead">
            <div class="stat-value">${dead}</div>
            <div class="stat-label">Dead</div>
          </div>
          <div class="stat-box https">
            <div class="stat-value">${https}</div>
            <div class="stat-label">HTTPS/TLS</div>
          </div>
        </div>

        <div class="bar-chart">
          <div class="bar-segment" style="width:${aliveW}%;background:#00dc50">${alive ? alive : ''}</div>
          <div class="bar-segment" style="width:${dnsW}%;background:#ffdc00">${dnsOnly ? dnsOnly : ''}</div>
          <div class="bar-segment" style="width:${deadW}%;background:#ff3c3c">${dead ? dead : ''}</div>
          <div class="bar-segment" style="width:${errW}%;background:#ff8000">${errors ? errors : ''}</div>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#00dc50"></div> Alive</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ffdc00"></div> DNS Only</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ff3c3c"></div> Dead</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ff8000"></div> Error/Unknown</div>
        </div>

        <div class="section">
          <h3>All Sites</h3>
          <div class="tabs" id="tabs"></div>
          <div class="controls">
            <input type="text" id="search" placeholder="Search domain, title, server, IP...">
            <button onclick="applyFilters()">Search</button>
            <button onclick="clearSearch()">Clear</button>
            <span id="result-info"></span>
            <button class="export-btn" onclick="exportCSV()">Export CSV</button>
          </div>
          <div class="table-container" id="sites-table"></div>
        </div>

        <div class="section">
          <h3>Response Time Distribution</h3>
          <div id="resp-chart"></div>
        </div>

        <div class="section">
          <h3>Server Software</h3>
          <div id="server-chart"></div>
        </div>

        <div class="section">
          <h3>TLS Issuers</h3>
          <div id="tls-chart"></div>
        </div>
      `;

      renderTabs(total, alive, dnsOnly, dead, errors);
      applyFilters();
      renderRespChart();
      renderServerChart();
      renderTLSChart();

      document.getElementById('search').addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFilters();
      });
    }

    // ── Tabs ────────────────────────────────────────────────
    function renderTabs(total, alive, dnsOnly, dead, errors) {
      const tabs = [
        { id: 'all', label: 'All', count: total },
        { id: 'alive', label: 'Alive', count: alive },
        { id: 'dns_only', label: 'DNS Only', count: dnsOnly },
        { id: 'dead', label: 'Dead', count: dead },
        { id: 'error', label: 'Error', count: errors },
      ];
      document.getElementById('tabs').innerHTML = tabs.map(t =>
        `<button class="tab${currentFilter === t.id ? ' active' : ''}" onclick="setFilter('${t.id}')">${t.label}<span class="count">(${t.count})</span></button>`
      ).join('');
    }

    function setFilter(f) {
      currentFilter = f;
      applyFilters();
      // Update active tab
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab[onclick*="${f}"]`)?.classList.add('active');
    }

    // ── Filter + Search ─────────────────────────────────────
    function applyFilters() {
      const term = (document.getElementById('search')?.value || '').toLowerCase();
      let sites = allSites;

      if (currentFilter !== 'all') {
        if (currentFilter === 'error') {
          sites = sites.filter(s => s.status === 'error' || s.status === 'unknown');
        } else {
          sites = sites.filter(s => s.status === currentFilter);
        }
      }

      if (term) {
        sites = sites.filter(s =>
          (s.domain || '').toLowerCase().includes(term) ||
          (s.httpTitle || '').toLowerCase().includes(term) ||
          (s.httpServer || '').toLowerCase().includes(term) ||
          (s.dnsIPs || '').toLowerCase().includes(term) ||
          (s.httpRedirect || '').toLowerCase().includes(term) ||
          (s.httpTLSIssuer || '').toLowerCase().includes(term) ||
          (s.dnsNS || '').toLowerCase().includes(term)
        );
      }

      if (currentSort.col !== null) {
        sites = [...sites].sort((a, b) => {
          let va = a[currentSort.col], vb = b[currentSort.col];
          if (typeof va === 'number' && typeof vb === 'number') return currentSort.asc ? va - vb : vb - va;
          va = (va || '').toString().toLowerCase();
          vb = (vb || '').toString().toLowerCase();
          return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }

      renderSitesTable(sites);
      document.getElementById('result-info').textContent = `Showing ${sites.length} of ${allSites.length} sites`;
    }

    function clearSearch() {
      document.getElementById('search').value = '';
      currentFilter = 'all';
      currentSort = { col: null, asc: true };
      applyFilters();
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelector('.tab')?.classList.add('active');
    }

    // ── Sites Table ─────────────────────────────────────────
    const columns = [
      { key: 'domain', label: 'Domain', render: v => v },
      { key: 'status', label: 'Status', render: v => `<span class="status-${v === 'dns_only' ? 'dns' : v}">${(v || 'unknown').toUpperCase()}</span>` },
      { key: 'dnsAlive', label: 'DNS', render: v => v ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>' },
      { key: 'dnsIPs', label: 'IPs', render: v => v ? `<span class="ip">${v}</span>` : '' },
      { key: 'httpAlive', label: 'HTTP', render: v => v ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>' },
      { key: 'httpStatus', label: 'Code', render: v => v || '' },
      { key: 'httpRespMs', label: 'ms', render: v => v ? `<span class="ms">${v}</span>` : '' },
      { key: 'httpTLS', label: 'TLS', render: v => v ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>' },
      { key: 'httpTitle', label: 'Title', render: v => v ? `<span class="title-cell" title="${esc(v)}">${esc(trunc(v,50))}</span>` : '' },
      { key: 'httpServer', label: 'Server', render: v => v ? `<span class="server-cell">${esc(v)}</span>` : '' },
    ];

    function sortBy(col) {
      if (currentSort.col === col) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.col = col;
        currentSort.asc = true;
      }
      applyFilters();
    }

    function renderSitesTable(sites) {
      if (!sites.length) {
        document.getElementById('sites-table').innerHTML = '<p style="color:#666">No sites match filters</p>';
        return;
      }
      let html = '<table><tr>';
      html += columns.map(c => {
        let arrow = '';
        if (currentSort.col === c.key) arrow = `<span class="sort-arrow">${currentSort.asc ? '▲' : '▼'}</span>`;
        return `<th onclick="sortBy('${c.key}')">${c.label}${arrow}</th>`;
      }).join('');
      html += '</tr>';

      for (const s of sites) {
        html += `<tr style="cursor:pointer" onclick="showDetail('${esc(s.domain)}')">`;
        html += columns.map(c => `<td>${c.render(s[c.key])}</td>`).join('');
        html += '</tr>';
      }
      html += '</table>';
      document.getElementById('sites-table').innerHTML = html;
    }

    // ── Detail Modal ────────────────────────────────────────
    function showDetail(domain) {
      const s = allSites.find(x => x.domain === domain);
      if (!s) return;

      const statusClass = s.status === 'dns_only' ? 'dns' : s.status;
      let html = `<h3 style="color:#00dc50">${esc(s.domain)}</h3>`;
      html += `<p><span class="status-${statusClass}" style="font-size:1.2em">${(s.status || 'unknown').toUpperCase()}</span></p>`;

      html += `<h3 style="font-size:1em; color:#3c8c50; margin-top:20px">Phenomenon 1: DNS</h3>`;
      html += '<div class="detail-grid">';
      html += row('DNS Alive', s.dnsAlive ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>');
      html += row('IPs', s.dnsIPs ? `<span class="ip">${esc(s.dnsIPs)}</span>` : '—');
      html += row('CNAME', s.dnsCnames || '—');
      html += row('MX Records', s.dnsMX || '—');
      html += row('Nameservers', s.dnsNS || '—');
      if (s.dnsError) html += row('DNS Error', `<span style="color:#ff3c3c">${esc(s.dnsError)}</span>`);
      html += '</div>';

      html += `<h3 style="font-size:1em; color:#3c8c50; margin-top:20px">Phenomenon 2: HTTP</h3>`;
      html += '<div class="detail-grid">';
      html += row('HTTP Alive', s.httpAlive ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>');
      html += row('Status Code', s.httpStatus || '—');
      html += row('Response Time', s.httpRespMs ? `${s.httpRespMs}ms` : '—');
      html += row('TLS/HTTPS', s.httpTLS ? '<span class="tls-yes">YES</span>' : '<span class="tls-no">NO</span>');
      html += row('TLS Issuer', s.httpTLSIssuer || '—');
      html += row('Page Title', s.httpTitle ? esc(s.httpTitle) : '—');
      html += row('Server', s.httpServer || '—');
      html += row('Redirect', s.httpRedirect ? `<span class="redirect">${esc(s.httpRedirect)}</span>` : '—');
      if (s.httpError) html += row('HTTP Error', `<span style="color:#ff3c3c">${esc(s.httpError)}</span>`);
      html += '</div>';

      html += `<h3 style="font-size:1em; color:#3c8c50; margin-top:20px">Meta</h3>`;
      html += '<div class="detail-grid">';
      html += row('First Checked', s.firstChecked || '—');
      html += row('Last Checked', s.lastChecked || '—');
      html += row('Times Checked', s.timesChecked || '0');
      html += '</div>';

      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal').classList.add('show');
    }

    function row(label, value) {
      return `<div class="detail-label">${label}</div><div class="detail-value">${value}</div>`;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ── Charts ──────────────────────────────────────────────
    function renderRespChart() {
      const alive = allSites.filter(s => s.httpAlive && s.httpRespMs > 0);
      if (!alive.length) {
        document.getElementById('resp-chart').innerHTML = '<p style="color:#666">No response data</p>';
        return;
      }
      const buckets = [
        { label: '<500ms', max: 500, color: '#00dc50' },
        { label: '500ms-1s', max: 1000, color: '#80dc50' },
        { label: '1-3s', max: 3000, color: '#ffdc00' },
        { label: '3-5s', max: 5000, color: '#ff8000' },
        { label: '5s+', max: Infinity, color: '#ff3c3c' },
      ];
      const counts = buckets.map(() => 0);
      for (const s of alive) {
        for (let i = 0; i < buckets.length; i++) {
          if (s.httpRespMs <= buckets[i].max) { counts[i]++; break; }
        }
      }
      let html = '<div class="bar-chart">';
      for (let i = 0; i < buckets.length; i++) {
        const pct = (counts[i] / alive.length * 100);
        if (pct > 0) {
          html += `<div class="bar-segment" style="width:${pct}%;background:${buckets[i].color}" title="${buckets[i].label}: ${counts[i]}">${counts[i] > 0 ? counts[i] : ''}</div>`;
        }
      }
      html += '</div>';
      html += '<div class="legend">';
      for (let i = 0; i < buckets.length; i++) {
        html += `<div class="legend-item"><div class="legend-dot" style="background:${buckets[i].color}"></div> ${buckets[i].label} (${counts[i]})</div>`;
      }
      html += '</div>';
      document.getElementById('resp-chart').innerHTML = html;
    }

    function renderServerChart() {
      const servers = {};
      for (const s of allSites) {
        if (s.httpServer) {
          const name = s.httpServer.split('/')[0].trim();
          servers[name] = (servers[name] || 0) + 1;
        }
      }
      const sorted = Object.entries(servers).sort((a, b) => b[1] - a[1]).slice(0, 15);
      if (!sorted.length) {
        document.getElementById('server-chart').innerHTML = '<p style="color:#666">No server data</p>';
        return;
      }
      const max = sorted[0][1];
      let html = '';
      for (const [name, count] of sorted) {
        const pct = (count / max * 100);
        html += `<div style="display:flex;align-items:center;gap:10px;margin:4px 0">
          <div style="width:140px;text-align:right;color:#888;font-size:0.85em;flex-shrink:0">${esc(name)}</div>
          <div style="flex:1;background:#1a1a1a;border-radius:3px;height:20px">
            <div style="width:${pct}%;background:#00dc50;height:100%;border-radius:3px;min-width:2px"></div>
          </div>
          <div style="width:40px;color:#888;font-size:0.85em">${count}</div>
        </div>`;
      }
      document.getElementById('server-chart').innerHTML = html;
    }

    function renderTLSChart() {
      const issuers = {};
      for (const s of allSites) {
        if (s.httpTLSIssuer) {
          issuers[s.httpTLSIssuer] = (issuers[s.httpTLSIssuer] || 0) + 1;
        }
      }
      const sorted = Object.entries(issuers).sort((a, b) => b[1] - a[1]).slice(0, 10);
      if (!sorted.length) {
        document.getElementById('tls-chart').innerHTML = '<p style="color:#666">No TLS data</p>';
        return;
      }
      const max = sorted[0][1];
      let html = '';
      for (const [name, count] of sorted) {
        const pct = (count / max * 100);
        html += `<div style="display:flex;align-items:center;gap:10px;margin:4px 0">
          <div style="width:200px;text-align:right;color:#888;font-size:0.85em;flex-shrink:0">${esc(name)}</div>
          <div style="flex:1;background:#1a1a1a;border-radius:3px;height:20px">
            <div style="width:${pct}%;background:#50c8ff;height:100%;border-radius:3px;min-width:2px"></div>
          </div>
          <div style="width:40px;color:#888;font-size:0.85em">${count}</div>
        </div>`;
      }
      document.getElementById('tls-chart').innerHTML = html;
    }

    // ── CSV Export ───────────────────────────────────────────
    function exportCSV() {
      const headers = ['domain','status','dns_alive','dns_ips','dns_cnames','dns_mx','dns_ns','dns_error',
        'http_alive','http_status','http_title','http_server','http_redirect','http_tls','http_tls_issuer',
        'http_error','http_response_ms','first_checked','last_checked','times_checked'];
      let csv = headers.join(',') + '\n';
      for (const s of allSites) {
        csv += [
          s.domain, s.status, s.dnsAlive, csvSafe(s.dnsIPs), csvSafe(s.dnsCnames), csvSafe(s.dnsMX),
          csvSafe(s.dnsNS), csvSafe(s.dnsError), s.httpAlive, s.httpStatus, csvSafe(s.httpTitle),
          csvSafe(s.httpServer), csvSafe(s.httpRedirect), s.httpTLS, csvSafe(s.httpTLSIssuer),
          csvSafe(s.httpError), s.httpRespMs, s.firstChecked, s.lastChecked, s.timesChecked
        ].join(',') + '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `frankenstein_export_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
    function csvSafe(v) {
      if (!v) return '';
      v = String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) return `"${v.replace(/"/g, '""')}"`;
      return v;
    }

    // ── Theme Toggle ─────────────────────────────────────────
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    // ── Easter Egg ──────────────────────────────────────────
    function showEasterEgg() {
      document.getElementById('easter-egg').classList.add('show');
    }
    function hideEasterEgg() {
      document.getElementById('easter-egg').classList.remove('show');
    }

    // ── Helpers ──────────────────────────────────────────────
    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    function trunc(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s || ''; }

    // ── Event Listeners ─────────────────────────────────────
    document.getElementById('file').onchange = e => e.target.files[0] && loadDB(e.target.files[0]);
    const dropEl = document.getElementById('drop');
    dropEl.ondragover = e => { e.preventDefault(); dropEl.classList.add('dragover'); };
    dropEl.ondragleave = () => dropEl.classList.remove('dragover');
    dropEl.ondrop = e => { e.preventDefault(); dropEl.classList.remove('dragover'); e.dataTransfer.files[0] && loadDB(e.dataTransfer.files[0]); };
  </script>
</body>
</html>
