name: Rotate GIF Banner

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  push:
    paths:
      - 'assets/**'
  workflow_dispatch:  # Manual trigger

jobs:
  rotate-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick random GIF
        run: |
          # Collect all GIFs in assets/
          mapfile -t GIFS < <(find assets -maxdepth 1 -iname '*.gif' -type f | sort)

          if [ ${#GIFS[@]} -eq 0 ]; then
            echo "No GIFs found in assets/"
            exit 0
          fi

          # Pick one at random
          RANDOM_IDX=$((RANDOM % ${#GIFS[@]}))
          CHOSEN="${GIFS[$RANDOM_IDX]}"
          ENCODED=$(echo "$CHOSEN" | sed 's/ /%20/g')

          echo "Picked: $CHOSEN"

          # Replace between markers
          awk -v gif="$ENCODED" '
            /<!-- GIF-START -->/{
              print
              print "<p align=\"center\">"
              print "<img src=\"" gif "\" width=\"500\">"
              print "</p>"
              skip=1
              next
            }
            /<!-- GIF-END -->/{skip=0}
            !skip{print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Rotate banner GIF"
          git push
